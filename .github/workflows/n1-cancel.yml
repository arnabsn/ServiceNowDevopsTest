name: n1-cancel

# Linear chain only. Pick one scenario per run; the other jobs are skipped.
# Gated jobs use the change action; n1-gated also sits behind environment s4-reject
# (required reviewer, no deployment protection app rule).

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which cancel case to run"
        type: choice
        default: cancel_with_cr
        options:
          - cancel_with_cr      # n1-with-cr creates a CR and waits; cancel the run while it waits
          - cancel_before_cr    # n1-gated waits for the reviewer; cancel the run before approving
          - reviewer_rejects    # n1-gated waits for the reviewer; reject it in GitHub

permissions:
  contents: read

jobs:
  n1-start:
    name: n1-start
    runs-on: ubuntu-latest
    steps:
      - run: echo "scenario = ${{ inputs.scenario }}"

  # Variant: cancel a running gated job that already has a CR
  n1-with-cr:
    name: n1-with-cr
    needs: [n1-start]
    if: ${{ inputs.scenario == 'cancel_with_cr' }}
    runs-on: ubuntu-latest
    steps:
      - uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'n1-with-cr'
          change-request: '{"attributes":{"chg_model":{"name":"Devops"},"short_description":"N1 cancel with CR","description":"N1","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'

  # Variants: cancel before the CR exists, reviewer rejects
  n1-gated:
    name: n1-gated
    needs: [n1-with-cr]
    if: ${{ (inputs.scenario == 'cancel_before_cr' || inputs.scenario == 'reviewer_rejects') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: s4-reject
    steps:
      - uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'n1-gated'
          change-request: '{"attributes":{"chg_model":{"name":"Devops"},"short_description":"N1 gated","description":"N1","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'

  n1-final:
    name: n1-final
    needs: [n1-with-cr, n1-gated]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "chain finished"
