name: n3-gate-matching

on:
  workflow_dispatch:
    inputs:
      skip_change_prod_eu:
        description: "Skip the change request step before the prod-eu deploy (gate with no callback)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: n3-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "build"

  # Gate 1: environment "prod"
  change-prod:
    name: change-prod
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Create change for prod
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN_2 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_DEVOPS_TOOL_2 }}
          context-github: ${{ toJSON(github) }}
          job-name: 'change-prod'
          deployment-gate: '{"environment":"prod","jobName":"deploy-prod"}'
          change-request: '{"attributes":{"short_description":"N3 gate prod","description":"N3 callback matching test","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'

  deploy-prod:
    name: deploy-prod
    needs: [change-prod]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "deploying prod"

  # Gate 2: "prod-eu" contains "prod", and the job name deploy-prod-eu contains "prod"
  change-prod-eu:
    name: change-prod-eu
    needs: [deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Create change for prod-eu
        if: ${{ !inputs.skip_change_prod_eu }}
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN_2 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_DEVOPS_TOOL_2 }}
          context-github: ${{ toJSON(github) }}
          job-name: 'change-prod-eu'
          deployment-gate: '{"environment":"prod-eu","jobName":"deploy-prod-eu"}'
          change-request: '{"attributes":{"short_description":"N3 gate prod-eu","description":"N3 callback matching test","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'
      - name: Note when the change step is skipped
        if: ${{ inputs.skip_change_prod_eu }}
        run: echo "change step skipped on purpose"

  deploy-prod-eu:
    name: deploy-prod-eu
    needs: [change-prod-eu]
    runs-on: ubuntu-latest
    environment: prod-eu
    steps:
      - run: echo "deploying prod-eu"

  # Gate 3: environment name with a space and #
  change-special:
    name: change-special
    needs: [deploy-prod-eu]
    runs-on: ubuntu-latest
    steps:
      - name: Create change for special environment
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN_2 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_DEVOPS_TOOL_2 }}
          context-github: ${{ toJSON(github) }}
          job-name: 'change-special'
          deployment-gate: '{"environment":"Prod #2","jobName":"deploy-special"}'
          change-request: '{"attributes":{"short_description":"N3 gate special env","description":"N3 callback matching test","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'

  deploy-special:
    name: deploy-special
    needs: [change-special]
    runs-on: ubuntu-latest
    environment: "Prod #2"
    steps:
      - run: echo "deploying special"
