name: n4-fork-pr

# Open a pull request from a fork using a first-time contributor account.
# GitHub holds the run as action_required until a maintainer approves it.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  n4-pr-job:
    name: n4-pr-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "fork pr run"
