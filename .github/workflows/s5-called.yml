name: s5-called

on:
  workflow_call:
    inputs:
      job_name:
        type: string
        required: true

jobs:
  child:
    name: child
    runs-on: ubuntu-latest
    steps:
      - uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ inputs.job_name }}
          change-request: '{"attributes":{"chg_model":{"name":"Devops"},"short_description":"S5 called workflow","description":"S5","implementation_plan":"n/a","backout_plan":"n/a","test_plan":"n/a"}}'
