name: s7-push

# Runs on pushes to s7/** branches and on pull requests, so DCV gets push and PR events.

on:
  push:
    branches: ['s7/**']
  pull_request:

permissions:
  contents: read

jobs:
  s7-push-job:
    name: s7-push-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "event = ${{ github.event_name }}"
